<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">GameSpec Logo</title>
  <desc id="desc">A neon lightning logo with the GameSpec wordmark.</desc>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4dff"/>
      <stop offset="0.5" stop-color="#7657ff"/>
      <stop offset="1" stop-color="#00d9ff"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8b45ff"/>
      <stop offset="0.5" stop-color="#00cfff"/>
      <stop offset="1" stop-color="#7ff7ff"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9ff"/>
      <stop offset="1" stop-color="#9a5cff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="720" height="220" fill="none"/>

  <g transform="translate(22 25)">
    <rect x="0" y="0" width="170" height="170" rx="38" fill="#080b25" stroke="url(#border)" stroke-width="8"/>
    <path d="M105 23 L52 91 H82 L60 147 L130 75 H96 Z"
          fill="url(#bolt)" filter="url(#glow)"/>
    <path d="M30 105 C55 140 120 143 147 108 C160 91 153 73 137 65"
          fill="none" stroke="url(#border)" stroke-width="9" stroke-linecap="round"/>
  </g>

  <text x="215" y="137" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" letter-spacing="-3">
    <tspan fill="#ffffff">Game</tspan><tspan fill="url(#spec)">Spec</tspan>
  </text>
</svg>